spring.application.name=clerova

openai.api-key=${OPENAI_API_KEY}
openai.base-url=${OPENAI_BASE_URL:}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clerova}
spring.datasource.username=${DATABASE_USERNAME:clerova}
spring.datasource.password=${DATABASE_PASSWORD:clerova_dev_password}

# Supabase's session pooler allows 15 client connections in total. During a
# Render deploy the old and new instances run side by side, so each instance
# must stay well under half of that.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Schema is managed by Flyway (src/main/resources/db/migration).
# Databases created before Flyway are baselined at V1 on first run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Shared migrations, plus database-specific ones ({vendor} is postgresql or h2)
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# Authentication (Supabase Auth). SUPABASE_URL is the project URL, e.g.
# https://abcd1234.supabase.co. SUPABASE_JWT_SECRET is only needed for
# projects still using the legacy shared JWT secret.
app.auth.supabase-url=${SUPABASE_URL}
app.auth.jwt-secret=${SUPABASE_JWT_SECRET:}

# Free trial for new sign-ups
app.trial.days=${TRIAL_DAYS:14}
app.trial.ai-monthly-limit=${TRIAL_AI_MONTHLY_LIMIT:100}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server.port=${PORT:8080}

# Use the client IP from the hosting proxy's X-Forwarded-For header
server.forward-headers-strategy=native

# Limits on typed requests and new suggestions (protect OpenAI spend).
# Counted in memory per instance. Forwarded emails aren't counted here.
app.ai.rate-limit.per-client-per-minute=${AI_RATE_LIMIT_PER_CLIENT_PER_MINUTE:10}
# A safety net across all customers; each plan's monthly requests are the
# real limit
app.ai.rate-limit.global-per-day=${AI_RATE_LIMIT_GLOBAL_PER_DAY:3000}

# Email intake (Postmark inbound) and replies (Postmark outbound).
# Forwarding addresses are <token>@INBOUND_EMAIL_DOMAIN. Intake is disabled
# until INBOUND_EMAIL_DOMAIN and INBOUND_WEBHOOK_PASSWORD are set; sending
# replies also needs POSTMARK_SERVER_TOKEN.
app.email.inbound-domain=${INBOUND_EMAIL_DOMAIN:}
app.email.webhook-username=${INBOUND_WEBHOOK_USERNAME:postmark}
app.email.webhook-password=${INBOUND_WEBHOOK_PASSWORD:}
app.email.postmark-server-token=${POSTMARK_SERVER_TOKEN:}
app.email.postmark-api-url=${POSTMARK_API_URL:https://api.postmarkapp.com}
app.email.processing.enabled=${EMAIL_PROCESSING_ENABLED:true}
app.email.processing.interval-ms=${EMAIL_PROCESSING_INTERVAL_MS:5000}

# Billing (Stripe). Off until STRIPE_SECRET_KEY is set; then every
# organization needs a subscription (card up front, free trial) to use AI.
# Prices are looked up by these Stripe lookup keys, e.g. starter_monthly,
# founding_growth_yearly.
app.billing.stripe-secret-key=${STRIPE_SECRET_KEY:}
app.billing.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.stripe-api-url=${STRIPE_API_URL:https://api.stripe.com}
app.billing.app-url=${APP_URL:http://localhost:5173}
app.billing.starter-monthly-requests=${STARTER_MONTHLY_REQUESTS:500}
app.billing.growth-monthly-requests=${GROWTH_MONTHLY_REQUESTS:1500}
app.billing.founding-spots=${FOUNDING_SPOTS:20}
# Reply-to address for emails Clerova sends about the account
app.email.support-address=${SUPPORT_EMAIL:hello@clerova-ai.com}
