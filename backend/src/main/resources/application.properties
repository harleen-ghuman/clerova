spring.application.name=clerova

openai.api-key=${OPENAI_API_KEY}
openai.base-url=${OPENAI_BASE_URL:}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clerova}
spring.datasource.username=${DATABASE_USERNAME:clerova}
spring.datasource.password=${DATABASE_PASSWORD:clerova_dev_password}

# Schema is managed by Flyway (src/main/resources/db/migration).
# Databases created before Flyway are baselined at V1 on first run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# Authentication (Supabase Auth). SUPABASE_URL is the project URL, e.g.
# https://abcd1234.supabase.co. SUPABASE_JWT_SECRET is only needed for
# projects still using the legacy shared JWT secret.
app.auth.supabase-url=${SUPABASE_URL}
app.auth.jwt-secret=${SUPABASE_JWT_SECRET:}

# Free trial for new sign-ups
app.trial.days=${TRIAL_DAYS:14}
app.trial.ai-monthly-limit=${TRIAL_AI_MONTHLY_LIMIT:100}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server.port=${PORT:8080}

# Use the client IP from the hosting proxy's X-Forwarded-For header
server.forward-headers-strategy=native

# AI usage limits (protect OpenAI spend). Counted in memory per instance.
app.ai.rate-limit.per-client-per-minute=${AI_RATE_LIMIT_PER_CLIENT_PER_MINUTE:10}
app.ai.rate-limit.global-per-day=${AI_RATE_LIMIT_GLOBAL_PER_DAY:500}

# Email intake (Postmark inbound) and replies (Postmark outbound).
# Forwarding addresses are <token>@INBOUND_EMAIL_DOMAIN. Intake is disabled
# until INBOUND_EMAIL_DOMAIN and INBOUND_WEBHOOK_PASSWORD are set; sending
# replies also needs POSTMARK_SERVER_TOKEN.
app.email.inbound-domain=${INBOUND_EMAIL_DOMAIN:}
app.email.webhook-username=${INBOUND_WEBHOOK_USERNAME:postmark}
app.email.webhook-password=${INBOUND_WEBHOOK_PASSWORD:}
app.email.postmark-server-token=${POSTMARK_SERVER_TOKEN:}
app.email.postmark-api-url=${POSTMARK_API_URL:https://api.postmarkapp.com}
app.email.processing.enabled=${EMAIL_PROCESSING_ENABLED:true}
app.email.processing.interval-ms=${EMAIL_PROCESSING_INTERVAL_MS:5000}
