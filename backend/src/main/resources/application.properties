spring.application.name=clerova

openai.api-key=${OPENAI_API_KEY}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clerova}
spring.datasource.username=${DATABASE_USERNAME:clerova}
spring.datasource.password=${DATABASE_PASSWORD:clerova_dev_password}

# Schema is managed by Flyway (src/main/resources/db/migration).
# Databases created before Flyway are baselined at V1 on first run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server.port=${PORT:8080}

# Use the client IP from the hosting proxy's X-Forwarded-For header
server.forward-headers-strategy=native

# AI usage limits (protect OpenAI spend). Counted in memory per instance.
app.ai.rate-limit.per-client-per-minute=${AI_RATE_LIMIT_PER_CLIENT_PER_MINUTE:10}
app.ai.rate-limit.global-per-day=${AI_RATE_LIMIT_GLOBAL_PER_DAY:500}