openai.api-key=${OPENAI_API_KEY:test-key}

# Test database - H2
spring.datasource.url=jdbc:h2:mem:clerova_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - schema comes from the Flyway migrations, so tests also validate them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.cors.allowed-origin=http://localhost:5173

app.ai.rate-limit.per-client-per-minute=1000
app.ai.rate-limit.global-per-day=100000

app.auth.supabase-url=http://localhost:54321
app.trial.days=14
app.trial.ai-monthly-limit=100

app.email.inbound-domain=in.test.clerova
app.email.webhook-username=postmark
app.email.webhook-password=webhook-secret
app.email.postmark-server-token=
app.email.postmark-api-url=http://localhost:1
# Tests drive the processor directly
app.email.processing.enabled=false
app.email.processing.interval-ms=5000
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

# Billing is off by default; BillingTest turns it on
app.billing.stripe-secret-key=
app.billing.webhook-secret=
app.billing.stripe-api-url=http://localhost:1
app.billing.app-url=http://localhost:5173
app.billing.starter-monthly-requests=500
app.billing.growth-monthly-requests=1500
app.billing.founding-spots=20
app.email.support-address=hello@clerova-ai.com
